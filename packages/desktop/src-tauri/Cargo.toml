[package]
name = "kala-desktop"
version = "0.3.2"
description = "Linux desktop client for an existing Kala Dashboard"
authors = ["Kala contributors"]
license = "MIT"
repository = "https://github.com/xingsy97/kala"
edition = "2021"
rust-version = "1.93"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
gtk = "=0.18.2"
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
webkit2gtk = "=2.0.2"

[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
