name: Promote Verified Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to promote
        required: true
      acceptance_run_id:
        description: Successful Release Clean-environment Acceptance workflow run ID
        required: true

permissions:
  actions: read
  attestations: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ inputs.tag }}', fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, package-manager-cache: false }
      - name: Require the selected run to match workflow, revision, and success
        env: { GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ inputs.acceptance_run_id }}', TAG: '${{ inputs.tag }}' }
        run: |
          set -euo pipefail
          REVISION=$(git rev-parse HEAD)
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .name)" = 'Release Clean-environment Acceptance'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .path)" = '.github/workflows/rc-acceptance.yml'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" = "$REVISION"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_branch)" = "$TAG"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          # Publish only after both source-free assets and GHCR images have
          # succeeded for this exact tag and revision, not merely been queued.
          for workflow in release.yml private-cloud-release.yml; do
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f branch="$TAG" -f event=push -f status=success -f per_page=100 \
              --jq '.workflow_runs[].head_sha' | awk -v revision="$REVISION" '$0 == revision { found=1 } END { exit !found }'
          done
          # A successful image/bundle job is not fresh-install evidence: require
            # the exact candidate-first Private Cloud VM job and the independent
            # Portable OCI digest VM job on this same tag and source revision.
            pc_run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/private-cloud-release.yml/runs" \
              -f branch="$TAG" -f event=push -f status=success -f per_page=100 \
              --jq '.workflow_runs[] | [.head_sha, .id, .run_attempt] | @tsv' | awk -F '\t' -v revision="$REVISION" '$1 == revision { print; exit }')
            test -n "$pc_run"
            IFS=$'\t' read -r _ FRESH_RUN_ID FRESH_RUN_ATTEMPT <<< "$pc_run"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FRESH_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "Fresh beta candidate install and restore (exact signed draft release)") | .conclusion' | grep -Fxq success
            echo "FRESH_RUN_ID=$FRESH_RUN_ID" >> "$GITHUB_ENV"
            echo "FRESH_RUN_ATTEMPT=$FRESH_RUN_ATTEMPT" >> "$GITHUB_ENV"
            portable_run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/portable-image-release.yml/runs" \
              -f branch="$TAG" -f event=workflow_dispatch -f status=success -f per_page=100 \
              --jq '.workflow_runs[] | [.head_sha, .id, .run_attempt] | @tsv' | awk -F '\t' -v revision="$REVISION" '$1 == revision { print; exit }')
            test -n "$portable_run"
            IFS=$'\t' read -r _ PORTABLE_RUN_ID PORTABLE_RUN_ATTEMPT <<< "$portable_run"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PORTABLE_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "isolated-vm-acceptance") | .conclusion' | grep -Fxq success
            echo "PORTABLE_RUN_ID=$PORTABLE_RUN_ID" >> "$GITHUB_ENV"
            echo "PORTABLE_RUN_ATTEMPT=$PORTABLE_RUN_ATTEMPT" >> "$GITHUB_ENV"
          # The closed-set promotion verifier checks every filename and digest
          # after download. In particular the six required Windows release
          # assets must not be rejected by the old three-platform policy.
      - name: Download and fail-closed verify the complete evidence matrix
        env: { GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ inputs.acceptance_run_id }}', TAG: '${{ inputs.tag }}' }
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          mkdir -p acceptance/evidence release-evidence
          gh run download "$RUN_ID" --pattern 'rc-evidence-*' --dir acceptance/evidence
          node scripts/release/verify-rc-evidence.mjs \
            --input acceptance/evidence --tag "$TAG" --revision "$(git rev-parse HEAD)" \
            --output release-evidence/rc-evidence.json
      - uses: sigstore/cosign-installer@v3
      - name: Revalidate the current closed draft and leave draft state
        env: { GH_TOKEN: '${{ github.token }}', TAG: '${{ inputs.tag }}' }
        run: |
          set -euo pipefail
          # The verified acceptance aggregate remains an Actions artifact, not a
          # 28th release asset; the promotion verifier reads it separately.
          CANDIDATE=$(mktemp -d)
          gh release download "$TAG" --dir "$CANDIDATE"
          REVISION=$(git rev-parse HEAD)
          # The core release owns the exact four-platform manifest. Verify the separately
          # signed Private Cloud assets before removing them from this disposable
          # download directory so core manifest closure remains strict.
          for target in linux-x64; do
            archive="$CANDIDATE/kala-private-cloud-${TAG#v}-$target.tar.gz"
            signature="$CANDIDATE/private-cloud-$target.sigstore.json"
            test -s "$archive" && test -s "$signature"
            cosign verify-blob --bundle "$signature" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/private-cloud-release.yml@refs/tags/$TAG" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
            tar -xOzf "$archive" ./manifest.json | jq -e --arg revision "$REVISION" --arg version "${TAG#v}" \
              '.revision == $revision and .version == $version' >/dev/null
            fresh_dir=$(mktemp -d)
              gh run download "$FRESH_RUN_ID" \
                --pattern "private-cloud-fresh-beta-evidence-$FRESH_RUN_ID-$FRESH_RUN_ATTEMPT" --dir "$fresh_dir"
              mapfile -t fresh_files < <(find "$fresh_dir" -type f -name '*.rc-evidence.json')
              test "${#fresh_files[@]}" -eq 1
              node scripts/release/verify-private-cloud-fresh-evidence.mjs \
                --evidence "${fresh_files[0]}" --archive "$archive" --tag "$TAG" --revision "$REVISION"
            # The signed bundle must be usable without GitHub credentials. Verify
            # full anonymous layer pulls, not just authenticated candidate E2E.
            anonymous_config=$(mktemp -d)
            for component in runtime ingress dashboard; do
              image=$(tar -xOzf "$archive" ./image-lock.json | jq -er ".images.$component")
              case "$image" in
                "ghcr.io/$GITHUB_REPOSITORY-private-cloud-$component"@sha256:*) ;;
                *) echo "Unexpected Private Cloud $component image ownership" >&2; exit 1 ;;
              esac
              [[ "${image##*@}" =~ ^sha256:[0-9a-f]{64}$ ]]
              DOCKER_CONFIG="$anonymous_config" docker pull --quiet "$image" >/dev/null
              DOCKER_CONFIG="$anonymous_config" docker image inspect "$image" >/dev/null
            done
            rm -rf -- "$anonymous_config"
            rm -- "$archive" "$signature"
          done
          node scripts/release/verify-promotion-candidate.mjs \
            --directory "$CANDIDATE" --evidence acceptance/evidence \
            --aggregate release-evidence/rc-evidence.json --tag "$TAG" --revision "$REVISION"
          for asset in manifest.json SHA256SUMS kala-executor.cjs \
            executor-update-manifest.json executor-update-public-key.pem \
            node-pty-win32-x64.tar.gz kala-executor-service-host-win32-x64.exe install-executor.ps1 \
            kala-dashboard-with-runtime.cjs \
            kala-copilot-runtime-win32-x64 \
            kala-copilot-runtime-node-win32-x64.node; do
            gh attestation verify "$CANDIDATE/$asset" --repo "$GITHUB_REPOSITORY"
          done
          cosign verify-blob \
            --bundle "$CANDIDATE/SHA256SUMS.sigstore.json" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$CANDIDATE/SHA256SUMS"
          portable_dir=$(mktemp -d)
            gh run download "$PORTABLE_RUN_ID" \
              --pattern "portable-isolated-vm-acceptance-$PORTABLE_RUN_ID-$PORTABLE_RUN_ATTEMPT" --dir "$portable_dir"
            mapfile -t portable_metadata < <(find "$portable_dir" -type f -name metadata.json)
            test "${#portable_metadata[@]}" -eq 1
            portable_evidence_dir=$(dirname "${portable_metadata[0]}")
            test "$(find "$portable_evidence_dir" -maxdepth 1 -type f | wc -l)" -eq 3
            cosign verify-blob --bundle "$portable_evidence_dir/metadata.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/portable-image-release.yml@refs/tags/$TAG" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$portable_evidence_dir/metadata.json"
            public_image=$(node scripts/release/verify-portable-public.mjs \
              --metadata "$portable_evidence_dir/metadata.json" \
              --acceptance "$portable_evidence_dir/acceptance.json" \
              --tag "$TAG" --revision "$REVISION" --repository "$GITHUB_REPOSITORY" | jq -er .image)
            # Fetch the manifest, config and every layer without the workflow's
            # registry login: manifest-only checks do not prove a public pull.
            anonymous_docker_config=$(mktemp -d)
            DOCKER_CONFIG="$anonymous_docker_config" docker pull "$public_image"
            DOCKER_CONFIG="$anonymous_docker_config" docker image inspect "$public_image" >/dev/null
            rm -rf -- "$anonymous_docker_config"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false
          fi
