name: GitHub Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Product release tag, for example v0.3.0-beta.18'
        required: true
      optional_host_native:
        description: 'Manually build self-contained Host/Dedicated binaries for qualification only; never add them to the default release'
        required: false
        type: boolean
        default: false
      native_targets:
        description: 'Matching-runner Copilot SDK runtime targets: Linux x64, macOS x64/arm64, and Windows x64; no standalone native Executor.'
        required: false
        # Linux arm64 is paused for the current release.
        default: 'linux-x64,darwin-x64,darwin-arm64,win32-x64'

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      component: ${{ steps.release.outputs.component }}
      native_targets: ${{ steps.release.outputs.native_targets }}
      native_matrix: ${{ steps.release.outputs.native_matrix }}
      has_native: ${{ steps.release.outputs.has_native }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve release target
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            test "$GITHUB_REF" = "refs/tags/$TAG" || { echo 'Select the exact release tag as the workflow dispatch ref' >&2; exit 1; }
            NATIVE_TARGETS="${{ inputs.native_targets }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            NATIVE_TARGETS=""
          fi
          COMPONENT="all"
          node scripts/release/version-policy.mjs --tag "$TAG"

          if [ -z "$NATIVE_TARGETS" ]; then
            # Linux arm64 is paused for the current release.
            NATIVE_TARGETS="linux-x64,darwin-x64,darwin-arm64,win32-x64"
          fi
          REQUIRED_NATIVE_TARGETS="linux-x64,darwin-x64,darwin-arm64,win32-x64"
          if [ "$NATIVE_TARGETS" != "$REQUIRED_NATIVE_TARGETS" ]; then
            echo "native_targets must include exactly the four matching-runner Copilot SDK runtimes: $REQUIRED_NATIVE_TARGETS; partial four-platform releases are not supported" >&2
            exit 1
          fi
          MATRIX_ENTRIES=""
          for t in $(echo "$NATIVE_TARGETS" | tr ',' ' '); do
            case "$t" in
              linux-x64) OS="ubuntu-24.04" ;;
              # linux-arm64) OS="ubuntu-24.04-arm" ;; # Paused for the current release.
              darwin-x64) OS="macos-15-intel" ;;
              darwin-arm64) OS="macos-15" ;;
              win32-x64) continue ;; # Built with the Windows-captured Portable Host in windows-assets.
              *) echo "Unsupported Copilot SDK runtime target: $t" >&2; exit 1 ;;
            esac
            ENTRY="{\"os\":\"$OS\",\"target\":\"$t\"}"
            if [ -z "$MATRIX_ENTRIES" ]; then
              MATRIX_ENTRIES="$ENTRY"
            else
              MATRIX_ENTRIES="$MATRIX_ENTRIES,$ENTRY"
            fi
          done
          NATIVE_MATRIX="{\"include\":[$MATRIX_ENTRIES]}"
          if [ -n "$MATRIX_ENTRIES" ]; then
            HAS_NATIVE="true"
          else
            HAS_NATIVE="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "native_targets=$NATIVE_TARGETS" >> "$GITHUB_OUTPUT"
          echo "native_matrix=$NATIVE_MATRIX" >> "$GITHUB_OUTPUT"
          echo "has_native=$HAS_NATIVE" >> "$GITHUB_OUTPUT"

  native-assets:
    needs: resolve
    if: needs.resolve.outputs.has_native == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.native_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.resolve.outputs.tag }}' }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:version -- --tag ${{ needs.resolve.outputs.tag }}
      - run: pnpm run build
      - run: pnpm run build:release-assets -- --component executor --tag ${{ needs.resolve.outputs.tag }} --repo ${{ github.repository }} --native-only --native-target ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: native-${{ matrix.target }}
          path: release/kala-*-${{ matrix.target }}*
          if-no-files-found: error

  optional-host-native:
    needs: resolve
    if: github.event_name == 'workflow_dispatch' && inputs.optional_host_native == true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.native_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.resolve.outputs.tag }}' }
      - uses: actions/setup-node@v5
        with: { node-version: 22, package-manager-cache: false }
      - run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:version -- --tag ${{ needs.resolve.outputs.tag }}
      - run: pnpm run build
      - run: pnpm run build:release-assets -- --component host --tag ${{ needs.resolve.outputs.tag }} --repo ${{ github.repository }} --native-only --native-target ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: optional-host-qualification-${{ matrix.target }}
          path: release/kala-*-${{ matrix.target }}*
          if-no-files-found: error

  cjs-release:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.resolve.outputs.tag }}' }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - run: pnpm install --frozen-lockfile
      - name: Configure test workers
        run: node scripts/testing/configure-test-workers.mjs
      - run: pnpm run verify:version -- --tag ${{ needs.resolve.outputs.tag }}
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test:extended
      - run: KALA_RUN_POSTGRES_INTEGRATION=1 pnpm --dir packages/host exec vitest run src/store/postgres-session.integration.test.ts
      - run: pnpm run privacy:history
      - run: pnpm run verify:licenses
      - run: pnpm run verify:public-packages
      - run: pnpm run build:release-assets -- --component ${{ needs.resolve.outputs.component }} --tag ${{ needs.resolve.outputs.tag }} --repo ${{ github.repository }} --no-native
      - run: pnpm run verify:release-assets
      - run: pnpm run verify:version -- --tag ${{ needs.resolve.outputs.tag }} --manifest release/manifest.json
      - name: Install-time smoke on release assets
        run: pnpm run verify:release-install
      - name: Keep the Linux CJS stage free of unstaged Windows outputs
        run: |
          rm -f release/*.ps1 release/*.exe release/*win32* release/*windows* release/*conpty* release/*winpty*
      - uses: actions/upload-artifact@v5
        with:
          name: cjs-release-assets
          path: release/*
          if-no-files-found: error

      - name: Stage draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          metadata="$(mktemp -d)"
          trap 'rm -rf "$metadata"' EXIT
          node scripts/release/extract-release-metadata.mjs release/kala-release-metadata.tar.gz "$metadata"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --notes-file "$metadata/RELEASE_NOTES.md"
          else
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --notes-file "$metadata/RELEASE_NOTES.md"
          fi
          node scripts/release/reconcile-github-release-assets.mjs --tag "$TAG" --directory release --preserve-private-cloud-assets

  windows-assets:
    needs: resolve
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.resolve.outputs.tag }}', fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, package-manager-cache: false }
      - run: corepack enable; corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Require GNU tar and gzip from Git for Windows for reproducible archives
        shell: pwsh
        run: |
          $tools = Join-Path $env:ProgramFiles 'Git\usr\bin'
          foreach ($name in @('tar.exe', 'gzip.exe')) {
            if (-not (Test-Path (Join-Path $tools $name))) { throw "Missing Git for Windows GNU archive tool $name" }
          }
          if ((& (Join-Path $tools 'tar.exe') --version | Select-Object -First 1) -notmatch 'GNU tar') { throw 'Git for Windows tar is not GNU tar' }
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'TAR_OPTIONS=--force-local' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: pnpm run verify:version -- --tag ${{ needs.resolve.outputs.tag }}
      - run: pnpm run build
      - name: Build the platform-neutral Portable Host on Windows Node.js 22
        run: pnpm run build:release-assets -- --component all --tag ${{ needs.resolve.outputs.tag }} --repo ${{ github.repository }} --no-native
      - name: Install and uninstall the generated Windows Portable manager
        run: node --test scripts/release/portable-manager-windows.test.mjs
      - name: Capture the Windows-built Host and Copilot runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $capture = Join-Path $env:RUNNER_TEMP 'windows-captured'
          New-Item -ItemType Directory -Force $capture | Out-Null
          Copy-Item release/kala-dashboard-with-runtime.cjs $capture/
          Copy-Item release/kala-copilot-runtime-win32-x64 $capture/
          Copy-Item release/kala-copilot-runtime-node-win32-x64.node $capture/
          $hostRelease = Join-Path $env:RUNNER_TEMP 'windows-host-release'
          Copy-Item release $hostRelease -Recurse
          "PRODUCT_E2E_WINDOWS_HOST_RELEASE_DIR=$hostRelease" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item release -Recurse -Force
      - name: Stage the existing Windows ConPTY and service-host dependencies
        run: pnpm run build:release-assets -- --component executor --tag ${{ needs.resolve.outputs.tag }} --repo ${{ github.repository }} --native-only --native-target win32-x64
      - name: Bind the Windows capture to the exact tag revision and hashes
        shell: pwsh
        env:
          CAPTURE_REVISION: '${{ github.sha }}'
        run: |
          $ErrorActionPreference = 'Stop'
          $capture = Join-Path $env:RUNNER_TEMP 'windows-captured'
          if ((git rev-parse HEAD).Trim() -ne $env:CAPTURE_REVISION) { throw 'Windows release checkout differs from the tag revision' }
          Copy-Item $env:PRODUCT_E2E_WINDOWS_HOST_RELEASE_DIR/kala-executor.cjs $capture/
          Copy-Item release/node-pty-win32-x64.tar.gz $capture/
          Copy-Item release/kala-executor-service-host-win32-x64.exe $capture/
          Set-Location $capture
          node -e "const fs=require('fs'),c=require('crypto');const names=fs.readdirSync('.').sort();const assets=Object.fromEntries(names.map(n=>[n,c.createHash('sha256').update(fs.readFileSync(n)).digest('hex')]));fs.writeFileSync('windows-capture-manifest.json',JSON.stringify({schemaVersion:1,revision:process.env.CAPTURE_REVISION,assets},null,2)+String.fromCharCode(10))"
      - name: Prepare the exact source-built Windows install fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item $env:RUNNER_TEMP/windows-captured/kala-executor.cjs release/
          tar -xzf release/node-pty-win32-x64.tar.gz -C release
          New-Item -ItemType Directory -Path release/prebuilds -Force | Out-Null
          Move-Item release/win32-x64 release/prebuilds/win32-x64 -Force
          "PRODUCT_E2E_WINDOWS_EXECUTOR_RELEASE_DIR=$((Resolve-Path release).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node scripts/product-e2e/prepare-windows-release-fixture.mjs --host-release $env:PRODUCT_E2E_WINDOWS_HOST_RELEASE_DIR --executor-release release
          if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare the exact Windows Host/Executor install fixture' }
      - name: Real Windows API created.command temporary install and Host session gate
        env:
          PRODUCT_E2E_WINDOWS_TARGET: executor
          PRODUCT_E2E_WINDOWS_INVITE_PREFLIGHT: '1'
        run: node scripts/product-e2e/verify-windows-terminal.mjs
      - name: Real Windows API created.command service install and Host session gate
        env:
          PRODUCT_E2E_WINDOWS_TARGET: executor
          PRODUCT_E2E_WINDOWS_SERVICE: '1'
          PRODUCT_E2E_WINDOWS_TERMINAL_PORT: '3326'
        run: node scripts/product-e2e/verify-windows-terminal.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: windows-captured-assets
          path: ${{ runner.temp }}/windows-captured/*
          if-no-files-found: error

  native-release:
    needs: [resolve, cjs-release, native-assets, windows-assets]
    if: always() && needs.resolve.result == 'success' && needs.cjs-release.result == 'success' && needs.native-assets.result == 'success' && needs.windows-assets.result == 'success' && needs.resolve.outputs.has_native == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.resolve.outputs.tag }}' }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:version -- --tag ${{ needs.resolve.outputs.tag }}
      - uses: actions/download-artifact@v5
        with:
          name: cjs-release-assets
          path: release
      - uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: windows-captured-assets
          path: ${{ runner.temp }}/windows-captured
      - name: Validate and stage the exact Windows-captured revision
        env:
          EXPECTED_REVISION: '${{ github.sha }}'
          WINDOWS_CAPTURE_DIR: ${{ runner.temp }}/windows-captured
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { copyFileSync, readFileSync, readdirSync } from 'node:fs'
          import { join } from 'node:path'
          const root = process.env.WINDOWS_CAPTURE_DIR
          const manifest = JSON.parse(readFileSync(join(root, 'windows-capture-manifest.json'), 'utf8'))
          const expected = ['kala-copilot-runtime-node-win32-x64.node', 'kala-copilot-runtime-win32-x64', 'kala-dashboard-with-runtime.cjs', 'kala-executor.cjs', 'kala-executor-service-host-win32-x64.exe', 'node-pty-win32-x64.tar.gz']
          if (manifest.schemaVersion !== 1 || manifest.revision !== process.env.EXPECTED_REVISION) throw new Error('Windows capture revision mismatch')
          if (JSON.stringify(Object.keys(manifest.assets).sort()) !== JSON.stringify([...expected].sort())) throw new Error('Windows capture manifest inventory is not exact')
          if (JSON.stringify(readdirSync(root).sort()) !== JSON.stringify([...expected, 'windows-capture-manifest.json'].sort())) throw new Error('Windows capture artifact inventory is not closed')
          for (const name of expected) {
            const bytes = readFileSync(join(root, name))
            if (createHash('sha256').update(bytes).digest('hex') !== manifest.assets[name]) throw new Error(`Windows capture checksum mismatch: ${name}`)
            if (name === 'kala-executor.cjs'
              && createHash('sha256').update(readFileSync(join('release', name))).digest('hex') !== manifest.assets[name]) {
              throw new Error('Windows Executor CJS differs from the canonical signed release asset')
            }
            if (name !== 'kala-executor.cjs') copyFileSync(join(root, name), join('release', name))
          }
          NODE
      - name: Restore executable bit on downloaded assets
        run: |
          find release -maxdepth 1 -type f \( -name 'kala-*' -o -name '*.cjs' -o -name '*.sh' \) -print0 \
            | xargs -0 -r chmod +x
      - name: Sign Executor update feed with the persistent operator key
        env:
          EXECUTOR_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.EXECUTOR_UPDATE_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          umask 077
          key_file=.executor-update-signing-key.pem
          trap 'rm -f -- "$key_file"' EXIT
          node -e 'const {writeFileSync}=require("node:fs"); const pem=process.env.EXECUTOR_UPDATE_PRIVATE_KEY_PEM; if (!pem) throw new Error("configure the persistent EXECUTOR_UPDATE_PRIVATE_KEY_PEM secret"); writeFileSync(".executor-update-signing-key.pem",pem,{flag:"wx",mode:0o600})'
          unset EXECUTOR_UPDATE_PRIVATE_KEY_PEM
          node scripts/release/sign-executor-update-feed.mjs --directory release --private-key-file "$key_file"
      - name: Embed the verified Windows installer payload in the Portable Host
        run: >-
          node scripts/release/embed-windows-assets-in-portable-host.mjs
          --directory release
          --repo ${{ github.repository }}
          --tag ${{ needs.resolve.outputs.tag }}
          --expected-revision ${{ github.sha }}
          --canonical-dashboard
      - run: pnpm run build:release-assets -- --component ${{ needs.resolve.outputs.component }} --tag ${{ needs.resolve.outputs.tag }} --repo ${{ github.repository }} --finalize-only
      - name: Require CJS Executor and existing Windows dependencies
        run: |
          test -f release/kala-executor.cjs
          test -f release/node-pty-win32-x64.tar.gz
          test -f release/kala-executor-service-host-win32-x64.exe
          test -f release/install-executor.ps1
          test -f release/kala-copilot-runtime-win32-x64
          test -f release/kala-copilot-runtime-node-win32-x64.node
          ! find release -maxdepth 1 -type f \( -name 'kala-executor-linux-*' -o -name 'kala-executor-darwin-*' -o -name 'kala-executor-win32-*.exe' \) -print -quit | grep -q .
          ! find release -maxdepth 1 -type f \( -iname '*.msi' -o -iname '*.dll' -o -iname '*win32-arm64*' -o -iname '*windows-arm64*' -o -iname '*linux-arm64*' \) -print -quit | grep -q .
      - run: pnpm run verify:release-assets
      - run: pnpm run verify:version -- --tag ${{ needs.resolve.outputs.tag }} --manifest release/manifest.json
      - name: Smoke standalone and adjacent-directory Portable Host installs
        run: pnpm run verify:release-install
      - uses: sigstore/cosign-installer@v3
      - name: Sign the checksum index with Sigstore keyless identity
        run: |
          for attempt in 1 2 3; do
            if cosign sign-blob --yes --bundle release/SHA256SUMS.sigstore.json release/SHA256SUMS; then break; fi
            rm -f release/SHA256SUMS.sigstore.json
            test "$attempt" -lt 3 || exit 1
            sleep 10
          done
      - name: Verify exact signed CJS Executor inventory
        run: |
          pnpm run verify:release-assets -- --require-signed
          cosign verify-blob \
            --bundle release/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release/SHA256SUMS
      - name: Attest final release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/*
      - name: Upload native assets and refreshed metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          metadata="$(mktemp -d)"
          trap 'rm -rf "$metadata"' EXIT
          node scripts/release/extract-release-metadata.mjs release/kala-release-metadata.tar.gz "$metadata"
          gh release edit "$TAG" --draft --notes-file "$metadata/RELEASE_NOTES.md"
          node scripts/release/reconcile-github-release-assets.mjs --tag "$TAG" --directory release --preserve-private-cloud-assets
