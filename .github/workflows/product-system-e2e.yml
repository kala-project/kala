name: Product System E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: product-system-e2e
  cancel-in-progress: false

jobs:
  windows-host-cjs-e2e:
    name: Windows x64 Portable Host CJS / Node.js 22
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Require GNU tar and gzip from Git for Windows for reproducible archives
        shell: pwsh
        run: |
          $tools = Join-Path $env:ProgramFiles 'Git\usr\bin'
          foreach ($name in @('tar.exe', 'gzip.exe')) {
            if (-not (Test-Path (Join-Path $tools $name))) { throw "Missing Git for Windows GNU archive tool $name" }
          }
          if ((& (Join-Path $tools 'tar.exe') --version | Select-Object -First 1) -notmatch 'GNU tar') { throw 'Git for Windows tar is not GNU tar' }
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'TAR_OPTIONS=--force-local' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows x64 Portable Host CJS and native Copilot runtime
        run: pnpm run build:release-assets -- --tag latest --repo xingsy97/kala --component host
      - name: Real Windows Host CJS boot and browser-accessible API
        env:
          PRODUCT_E2E_WINDOWS_TARGET: host
        run: node scripts/product-e2e/verify-windows-terminal.mjs

  windows-executor-conpty-e2e:
    name: Windows x64 CJS Executor / ConPTY lifecycle
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Require GNU tar and gzip from Git for Windows for reproducible archives
        shell: pwsh
        run: |
          $tools = Join-Path $env:ProgramFiles 'Git\usr\bin'
          foreach ($name in @('tar.exe', 'gzip.exe')) {
            if (-not (Test-Path (Join-Path $tools $name))) { throw "Missing Git for Windows GNU archive tool $name" }
          }
          if ((& (Join-Path $tools 'tar.exe') --version | Select-Object -First 1) -notmatch 'GNU tar') { throw 'Git for Windows tar is not GNU tar' }
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'TAR_OPTIONS=--force-local' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build isolated Windows Host fixture
        shell: pwsh
        run: |
          pnpm run build:release-assets -- --component all --tag latest --repo xingsy97/kala
          if ($LASTEXITCODE -ne 0) { throw 'Windows release asset verification failed' }
          $hostRelease = Join-Path $env:RUNNER_TEMP 'windows-host-release'
          Copy-Item release $hostRelease -Recurse
          "PRODUCT_E2E_WINDOWS_HOST_RELEASE_DIR=$hostRelease" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Stage Windows x64 ConPTY and service-host dependencies
        run: pnpm run build:release-assets -- --component executor --native-only --native-target win32-x64 --tag latest --repo xingsy97/kala
      - name: Verify and stage isolated Windows Executor payload
        shell: pwsh
        run: |
          Copy-Item $env:PRODUCT_E2E_WINDOWS_HOST_RELEASE_DIR/kala-executor.cjs release/
          if (-not (Test-Path release/kala-executor.cjs)) { throw 'missing Windows Executor CJS' }
          if (-not (Test-Path release/node-pty-win32-x64.tar.gz)) { throw 'missing ConPTY companion' }
          if (-not (Test-Path release/kala-executor-service-host-win32-x64.exe)) { throw 'missing Windows service host' }
          node --input-type=module -e "import { verifyWindowsServiceHost } from './scripts/release/windows-service-host.mjs'; verifyWindowsServiceHost('release/kala-executor-service-host-win32-x64.exe')"
          if ($LASTEXITCODE -ne 0) { throw 'Windows service host verification failed' }
          tar -xzf release/node-pty-win32-x64.tar.gz -C release
          if ($LASTEXITCODE -ne 0) { throw 'Windows ConPTY archive extraction failed' }
          New-Item -ItemType Directory -Path release/prebuilds -Force | Out-Null
          Move-Item release/win32-x64 release/prebuilds/win32-x64 -Force
          if (-not (Test-Path release/prebuilds/win32-x64/conpty.node)) { throw 'ConPTY native was not installed beside Executor' }
          if (-not (Test-Path release/worker/conoutSocketWorker.js)) { throw 'ConPTY worker was not installed beside Executor' }
          if (-not (Test-Path release/shared/conout.js)) { throw 'ConPTY worker shared module was not installed beside Executor' }
          "PRODUCT_E2E_WINDOWS_EXECUTOR_RELEASE_DIR=$((Resolve-Path release).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node scripts/product-e2e/prepare-windows-release-fixture.mjs --host-release $env:PRODUCT_E2E_WINDOWS_HOST_RELEASE_DIR --executor-release release
          if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare Windows source-built Host/Executor fixture' }
      - name: Real Windows API created.command temporary Terminal lifecycle and invite.ps1 security preflight
        env:
          PRODUCT_E2E_WINDOWS_TARGET: executor
          PRODUCT_E2E_WINDOWS_INVITE_PREFLIGHT: '1'
        run: node scripts/product-e2e/verify-windows-terminal.mjs
      - name: Real Windows service Terminal lifecycle E2E
        env:
          PRODUCT_E2E_WINDOWS_TARGET: executor
          PRODUCT_E2E_WINDOWS_SERVICE: '1'
          PRODUCT_E2E_WINDOWS_TERMINAL_PORT: '3326'
        run: node scripts/product-e2e/verify-windows-terminal.mjs
      - name: Build the Private Cloud ingress fixture
        run: pnpm --filter @agent-kernel/runtime-ingress-gateway build
      - name: Real Private Cloud valid invite temporary and service lifecycle
        run: node scripts/product-e2e/verify-private-cloud-windows-invite.mjs

  linux-system-e2e:
    name: production artifact / Chromium / LXD (optional runner)
    # Keep this stronger system matrix visible but do not queue it forever when
    # the repository has no registered LXD runner. Portable release acceptance
    # uses matching hosted runners instead.
    if: vars.KALA_LXD_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, lxd-container]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Verify system-E2E harness fidelity
        run: pnpm run test:product-e2e-harness
      - name: Preflight real-system capabilities
        run: |
          set -eu
          test -x /snap/bin/chromium || test -n "$(command -v chromium || true)"
          lxc info >/dev/null
          lxc image info ubuntu:24.04 >/dev/null
          test -z "$(lxc list 'runlab-e2e-*' --format csv -c n)"
      - name: Build production release artifacts
        run: pnpm run build:release-assets -- --tag latest --repo xingsy97/kala
      - name: Verify release artifacts
        run: pnpm run verify:release-assets && pnpm run verify:release-install
      - name: Add Workspace Linux service system E2E
        env:
          PRODUCT_E2E_EVIDENCE_ROOT: ${{ runner.temp }}/evidence/add-workspace-linux-service
        run: pnpm run verify:e2e:add-workspace-linux-service
      - name: Add Workspace Linux temporary system E2E
        env:
          PRODUCT_E2E_EVIDENCE_ROOT: ${{ runner.temp }}/evidence/add-workspace-linux-temporary
        run: pnpm run verify:e2e:add-workspace-linux-temporary
      - name: Core Workspace journeys system E2E
        env:
          PRODUCT_E2E_EVIDENCE_ROOT: ${{ runner.temp }}/evidence/core-workspace-journeys
        run: pnpm run verify:e2e:core-workspace-journeys
      - name: Controlled agent journey system E2E
        env:
          PRODUCT_E2E_EVIDENCE_ROOT: ${{ runner.temp }}/evidence/controlled-agent-journey
        run: pnpm run verify:e2e:controlled-agent-journey
      - name: PWA update/reload system E2E
        env:
          PRODUCT_E2E_EVIDENCE_ROOT: ${{ runner.temp }}/evidence/pwa-update-reload
        run: pnpm run verify:e2e:pwa-update-reload
      - name: Production responsive/PWA viewport matrix
        run: pnpm run verify:dashboard-mobile-pwa
      - name: Production long-session performance budget
        env:
          PERF_TURNS: '300'
          PERF_ASSERT_BUDGET: '1'
          PERF_EVIDENCE_ROOT: ${{ runner.temp }}/evidence/performance
        run: pnpm run perf:profile-production
      - name: Emergency orphan cleanup
        if: always()
        run: |
          set +e
          lxc list 'runlab-e2e-*' --format csv -c n | while read -r name; do
            test -z "$name" || lxc delete --force "$name"
          done
          remaining=$(lxc list 'runlab-e2e-*' --format csv -c n)
          test -z "$remaining"
      - name: Upload structured system-E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-system-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 30
